server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Redirection /resume-builder -> /resume-builder/
    location = /resume-builder {
        return 301 $scheme://$http_host/resume-builder/;
    }

    # Reverse proxy API sous /resume-builder/api/
    location ^~ /resume-builder/api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Reverse proxy API à la racine /api/
    location ^~ /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Application servie sous /resume-builder/
    location ^~ /resume-builder/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /resume-builder/index.html;
    }

    # Redirection de la racine / vers /resume-builder/
    location = / {
        return 302 $scheme://$http_host/resume-builder/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
